name: Publicar portfolio en GitHub Pages

on:
  push:
    branches:
      - portfolio
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar GitHub Pages para Next.js
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar portfolio
        run: npm run build

      - name: Subir web compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
